[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mikebalcic-confdiff"
version = "0.1.0"
description = "把配置差异按语义分类，去掉格式噪音"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mikebalcic" }]
keywords = ["config", "diff", "devops", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mikebalcic/confdiff"
Repository = "https://github.com/mikebalcic/confdiff"
Issues = "https://github.com/mikebalcic/confdiff/issues"

[project.scripts]
confdiff = "confdiff:main"

[tool.setuptools]
py-modules = ["confdiff"]
